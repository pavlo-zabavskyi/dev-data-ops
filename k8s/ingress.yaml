apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-gitops
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-gitops
                port: 
                  number: 80
